[package]
name = "oddatui"
version = "0.1.0"
edition = "2021"
description = "A TUI for fetching, managing, and predictively analyzing antepost betting odds."
license = "MIT"
authors = ["Camillo"]

[dependencies]
# UI
ratatui = "0.29.0"
crossterm = "0.28.1"

# Async & Networking
tokio = { version = "1.43.0", features = ["full"] }
reqwest = { version = "0.12.12", features = ["json"] }

# Data Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

# Error Handling
anyhow = "1.0.95"

# Environment & Cache
dotenvy = "0.15.7"
directories = "5.0.1"
